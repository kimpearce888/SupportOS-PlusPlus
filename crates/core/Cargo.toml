[package]
name = "supportos-plusplus-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "SupportOS++ core: pure-Rust business logic, DB, sync, AI, VectorStore."

[lib]
name = "spp_core"
path = "src/lib.rs"

[dependencies]
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
time.workspace = true
tokio.workspace = true
rusqlite.workspace = true
aes-gcm.workspace = true
scrypt.workspace = true
rand.workspace = true
subtle.workspace = true
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
hyper.workspace = true
regex.workspace = true
async-trait = "0.1"
reqwest = { workspace = true }
url = { workspace = true }
futures-util = { workspace = true }
tokio-stream = { workspace = true }
crc32fast = { workspace = true }
# Re-export the catalog crate so callers don't need a separate dep.
supportos-plusplus-catalog = { workspace = true }

[dev-dependencies]
tempfile = "3"

[features]
# Enable the Qdrant Edge embedded vector store adapter (spec A4).
# Off by default — adds ~400 deps + significant build time. The InMemoryVectorStore
# (Fake adapter, spec A12) is always available; the Qdrant adapter is only needed
# for production deployments that want true vector persistence.
# CI enables this feature in a separate job to verify it builds + the contract passes.
default = []
qdrant = ["dep:qdrant-edge"]

[dependencies.qdrant-edge]
version = "=0.8.0"
optional = true
default-features = false
