name: Release

on:
  push:
    tags:
      - "v*"
      - "milestone-*"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  publish:
    name: Build installers (Linux x86_64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install Linux system deps (Tauri 2)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev build-essential pkg-config \
            dpkg-dev rpm wget
      - name: Install trunk + tauri-cli
        run: |
          cargo install trunk --locked
          cargo install tauri-cli --version "^2.0" --locked
      - name: Build WASM frontend
        run: |
          cd crates/ui
          trunk build
      - name: Build Tauri app + bundle
        run: |
          cd crates/app/src-tauri
          cargo tauri build
      - name: Generate SHA-256 checksums
        run: |
          BUNDLE_DIR="target/release/bundle"
          if [ ! -d "$BUNDLE_DIR" ]; then
            BUNDLE_DIR="crates/app/src-tauri/target/release/bundle"
          fi
          cd "$BUNDLE_DIR"
          find . -type f \( -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" \) -exec sha256sum {} \; > checksums.txt
          cat checksums.txt
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "SupportOS++ ${{ github.ref_name }}"
          body: |
            See [docs/MANUAL-VERIFICATION.md](../../blob/${{ github.ref_name }}/docs/MANUAL-VERIFICATION.md) for the install + verify checklist.

            Linux x86_64 only. Windows and macOS excluded by owner decision (DEV-006).
          prerelease: true
          files: |
            target/release/bundle/**/*.deb
            target/release/bundle/**/*.rpm
            target/release/bundle/**/*.AppImage
            target/release/bundle/**/checksums.txt
            crates/app/src-tauri/target/release/bundle/**/*.deb
            crates/app/src-tauri/target/release/bundle/**/*.rpm
            crates/app/src-tauri/target/release/bundle/**/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
