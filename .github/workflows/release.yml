name: Release

on:
  push:
    tags:
      - "v*"
      - "milestone-*"

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Build installers (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            formats: msi,nsis
          - os: macos-latest
            target: aarch64-apple-darwin
            formats: dmg
          - os: macos-13
            target: x86_64-apple-darwin
            formats: dmg
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            formats: deb,rpm,appimage
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            formats: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }},wasm32-unknown-unknown
      - name: Install Linux system deps (Tauri 2)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev build-essential pkg-config
      - name: Install trunk
        run: cargo install trunk --locked
      - name: Build installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: crates/app/src-tauri
          tagName: ${{ github.ref_name }}
          releaseName: "SupportOS++ ${{ github.ref_name }}"
          releaseBody: |
            See [docs/CHANGELOG](../../blob/${{ github.ref_name }}/docs/original-notes/changelog.md) for changes.
            See [docs/MANUAL-VERIFICATION.md](../../blob/${{ github.ref_name }}/docs/MANUAL-VERIFICATION.md) for the install + verify checklist.
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}
