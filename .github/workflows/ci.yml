name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint-and-test:
    name: fmt + clippy + test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Install Linux system deps (Tauri 2)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev build-essential curl wget file pkg-config

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ matrix.os }}-cargo-

      - name: rustfmt check
        run: cargo fmt --all -- --check

      - name: Verify Tauri config meets A0 (no system deps needed)
        run: cargo run -p supportos-plusplus-xtask --bin xtask -- verify-config

      - name: clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace --all-targets

  clean-build-check:
    name: Clean build check (no TODOs, no secrets, no dead code)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Check for TODO/FIXME/HACK in production code
        run: |
          # Fail if TODO/FIXME/HACK found in production code (excluding tests).
          if grep -rn "TODO\|FIXME\|HACK\|XXX" crates/core/src/ crates/ui/src/ crates/app/src-tauri/src/ \
            --include="*.rs" | grep -v "test\|tests\|#\[cfg(test" | grep -v "demo_mode\|Fake\|demo mode"; then
            echo "❌ Found TODO/FIXME/HACK in production code"
            exit 1
          fi
          echo "✅ No TODO/FIXME/HACK in production code"
      - name: Check for debug leftovers (dbg!, println!, eprintln!)
        run: |
          if grep -rn "dbg!\|println!\|eprintln!" crates/core/src/ crates/ui/src/ crates/app/src-tauri/src/ \
            --include="*.rs" | grep -v "test\|tests\|#\[cfg(test"; then
            echo "❌ Found debug leftovers in production code"
            exit 1
          fi
          echo "✅ No debug leftovers in production code"
      - name: Check for secrets/build outputs in tracked files
        run: |
          if git ls-files | grep -E "\.db$|\.db-wal|\.db-shm|\.sosync|target/|\.env$"; then
            echo "❌ Found build outputs or secrets in tracked files"
            exit 1
          fi
          echo "✅ No secrets or build outputs in tracked files"
      - name: Check for commented-out code
        run: |
          # Look for blocks of 3+ consecutive commented-out lines (excluding docs).
          if grep -rn "^\s*//.*[a-z]" crates/core/src/ crates/ui/src/ crates/app/src-tauri/src/ \
            --include="*.rs" | grep -v "test\|tests\|#\[cfg(test\|//!" | grep -v "^.*://" | \
            awk -F: '{print $1}' | sort | uniq -c | sort -rn | head -5 | awk '$1 > 10 {print}'; then
            echo "⚠️ Possible commented-out code blocks found (manual review needed)"
          else
            echo "✅ No large commented-out code blocks"
          fi

  build-wasm:
    name: cargo check on wasm32 + trunk build (debug)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install trunk
        run: cargo install trunk --locked
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: wasm-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
      - name: cargo check UI crate on wasm32 target
        run: cargo check -p supportos-plusplus-ui --target wasm32-unknown-unknown
      - name: Build WASM UI (debug, no wasm-opt)
        run: |
          cd crates/ui
          trunk build

  build-tauri:
    name: Tauri build + bundle (Linux)
    needs: [lint-and-test, build-wasm]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install Linux system deps (Tauri 2)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev build-essential pkg-config \
            dpkg-dev rpm wget
      - name: Install trunk + tauri-cli
        run: |
          cargo install trunk --locked
          cargo install tauri-cli --version "^2.0" --locked
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-release-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
      - name: Build WASM frontend
        run: |
          cd crates/ui
          trunk build
      - name: Build Tauri app + bundle
        run: |
          cd crates/app/src-tauri
          cargo tauri build

  cargo-audit:
    name: cargo audit (security advisories)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run cargo audit
        run: cargo audit --ignore unmaintained

  step3-real-mode:
    name: STEP 3 — Real-mode checks (stand-in servers)
    needs: [lint-and-test, build-wasm]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Run real-mode checks
        run: |
          python3 scripts/step3_real_mode.py
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step3-report
          path: /tmp/step3-report.md

  ci-report:
    name: Publish CI report
    needs: [lint-and-test, build-wasm, build-tauri, step3-real-mode, cargo-audit, clean-build-check]
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Generate report
        run: |
          mkdir -p ci-report
          cat > ci-report/report.md << 'REPORT'
          # CI Report — ${{ github.sha }}

          Run: ${{ github.run_id }}
          Branch: ${{ github.ref_name }}
          Commit: ${{ github.event.head_commit.message }}

          ## Job Results

          | Job | Status |
          |---|---|
          | lint-and-test (ubuntu-22.04) | ${{ needs.lint-and-test.result }} |
          | lint-and-test (ubuntu-24.04) | ${{ needs.lint-and-test.result }} |
          | build-wasm | ${{ needs.build-wasm.result }} |
          | build-tauri (Linux) | ${{ needs.build-tauri.result }} |
          | step3-real-mode | ${{ needs.step3-real-mode.result }} |
          | cargo-audit | ${{ needs.cargo-audit.result }} |
          | clean-build-check | ${{ needs.clean-build-check.result }} |

          Overall: ${{ needs.lint-and-test.result == 'success' && needs.build-wasm.result == 'success' && '✅ GREEN' || '❌ RED' }}
          REPORT
        env:
          GH_SHA: ${{ github.sha }}
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: ci-report
          path: ci-report/report.md
