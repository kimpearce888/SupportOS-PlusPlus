name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint-and-test:
    name: fmt + clippy + test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Install Linux system deps (Tauri 2)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev build-essential curl wget file pkg-config

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ matrix.os }}-cargo-

      - name: rustfmt check
        run: cargo fmt --all -- --check

      - name: Verify Tauri config meets A0 (no system deps needed)
        run: cargo run -p supportos-plusplus-xtask --bin xtask -- verify-config

      - name: clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests (exclude Tauri shell on macOS due to upstream _EMBED_INFO_PLIST duplicate symbol)
        run: cargo test --workspace --all-targets --exclude supportos-plusplus-app
        if: runner.os == 'macOS'

      - name: Tests
        run: cargo test --workspace --all-targets
        if: runner.os != 'macOS'

  build-wasm:
    name: cargo check on wasm32 + trunk build (debug)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install trunk
        run: cargo install trunk --locked
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: wasm-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
      - name: cargo check UI crate on wasm32 target
        run: cargo check -p supportos-plusplus-ui --target wasm32-unknown-unknown
      - name: Build WASM UI (debug, no wasm-opt)
        run: |
          cd crates/ui
          trunk build

  build-tauri:
    name: Tauri build + bundle (${{ matrix.os }})
    needs: [lint-and-test, build-wasm]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install Linux system deps (Tauri 2)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev build-essential pkg-config \
            dpkg-dev rpm wget
      - name: Install trunk + tauri-cli
        run: |
          cargo install trunk --locked
          cargo install tauri-cli --version "^2.0" --locked
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.os }}-release-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
      - name: Build WASM frontend
        run: |
          cd crates/ui
          trunk build
      - name: Build Tauri app + bundle
        run: |
          cd crates/app/src-tauri
          cargo tauri build

  ci-report:
    name: Publish CI report
    needs: [lint-and-test, build-wasm, build-tauri]
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Generate report
        run: |
          mkdir -p ci-report
          cat > ci-report/report.md << 'REPORT'
          # CI Report — ${{ github.sha }}

          Run: ${{ github.run_id }}
          Branch: ${{ github.ref_name }}
          Commit: ${{ github.event.head_commit.message }}

          ## Job Results

          | Job | Status |
          |---|---|
          | lint-and-test (ubuntu-22.04) | ${{ needs.lint-and-test.result }} |
          | lint-and-test (ubuntu-24.04) | ${{ needs.lint-and-test.result }} |
          | lint-and-test (macos-latest) | ${{ needs.lint-and-test.result }} |
          | lint-and-test (windows-latest) | ${{ needs.lint-and-test.result }} |
          | build-wasm | ${{ needs.build-wasm.result }} |
          | build-tauri (ubuntu-22.04) | ${{ needs.build-tauri.result }} |
          | build-tauri (macos-latest) | ${{ needs.build-tauri.result }} |
          | build-tauri (windows-latest) | ${{ needs.build-tauri.result }} |

          Overall: ${{ needs.lint-and-test.result == 'success' && needs.build-wasm.result == 'success' && '✅ GREEN' || '❌ RED' }}
          REPORT
        env:
          GH_SHA: ${{ github.sha }}
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: ci-report
          path: ci-report/report.md
