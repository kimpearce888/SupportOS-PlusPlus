name: Nightly

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
          - os: windows-latest
          - os: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev build-essential pkg-config \
            dpkg-dev rpm wget

      - name: Install trunk + tauri-cli
        run: |
          cargo install trunk --locked
          cargo install tauri-cli --version "^2.0" --locked

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: nightly-${{ matrix.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}

      - name: Build WASM frontend
        run: |
          cd crates/ui
          trunk build

      - name: Build Tauri app + bundle installers
        run: |
          cd crates/app/src-tauri
          cargo tauri build

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          cd crates/app/src-tauri/target/release/bundle
          # Use shasum -a 256 on macOS, sha256sum on Linux/Windows
          SHA_CMD="sha256sum"
          if command -v shasum >/dev/null 2>&1 && ! command -v sha256sum >/dev/null 2>&1; then
            SHA_CMD="shasum -a 256"
          fi
          find . -type f \( -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" \
            -o -name "*.msi" -o -name "*.exe" -o -name "*.dmg" \) -exec $SHA_CMD {} \; > checksums.txt || true
          cat checksums.txt 2>/dev/null || echo "No installer files found"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nightly-${{ matrix.os }}
          path: |
            crates/app/src-tauri/target/release/bundle/**/*.deb
            crates/app/src-tauri/target/release/bundle/**/*.rpm
            crates/app/src-tauri/target/release/bundle/**/*.AppImage
            crates/app/src-tauri/target/release/bundle/**/*.msi
            crates/app/src-tauri/target/release/bundle/**/*.exe
            crates/app/src-tauri/target/release/bundle/**/*.dmg
            crates/app/src-tauri/target/release/bundle/**/checksums.txt
          retention-days: 7

      - name: Upload to nightly pre-release
        if: github.event_name != 'schedule'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: "Nightly Development Build"
          body: |
            ⚠️ Development build, unsigned.

            Built from commit ${{ github.sha }} on ${{ matrix.os }}.

            DO NOT use in production. Testing only.
          prerelease: true
          files: |
            crates/app/src-tauri/target/release/bundle/**/*.deb
            crates/app/src-tauri/target/release/bundle/**/*.rpm
            crates/app/src-tauri/target/release/bundle/**/*.AppImage
            crates/app/src-tauri/target/release/bundle/**/*.msi
            crates/app/src-tauri/target/release/bundle/**/*.exe
            crates/app/src-tauri/target/release/bundle/**/*.dmg
            crates/app/src-tauri/target/release/bundle/**/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
