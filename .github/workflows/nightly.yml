name: Nightly

on:
  push:
    branches: [main]
  schedule:
    # Run at 03:00 UTC every day.
    - cron: '0 3 * * *'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-release:
    name: Build installers + publish nightly
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: deb
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: msi
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: dmg

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,${{ matrix.target }}

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev build-essential pkg-config

      - name: Install trunk
        run: cargo install trunk --locked

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: nightly-${{ matrix.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}

      - name: Build installers
        run: |
          cd crates/app/src-tauri
          cargo tauri build --target ${{ matrix.target }}
        continue-on-error: ${{ matrix.os == 'macos-latest' }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-${{ matrix.artifact }}
          path: |
            crates/app/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            crates/app/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.rpm
            crates/app/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            crates/app/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            crates/app/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            crates/app/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            crates/app/src-tauri/target/release/bundle/**/*.deb
            crates/app/src-tauri/target/release/bundle/**/*.msi
            crates/app/src-tauri/target/release/bundle/**/*.dmg
          retention-days: 7

      - name: Create/Update nightly pre-release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: "Nightly Development Build"
          body: |
            ⚠️ **Development build, unsigned.**

            Built from the latest `main` branch commit (${{ github.sha }}).

            **DO NOT use this in production.** This build is for testing only.
            It may crash, lose data, or behave unexpectedly.

            Install at your own risk. To remove, uninstall like any other app.
          prerelease: true
          files: |
            crates/app/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            crates/app/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            crates/app/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            crates/app/src-tauri/target/release/bundle/**/*.deb
            crates/app/src-tauri/target/release/bundle/**/*.msi
            crates/app/src-tauri/target/release/bundle/**/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
