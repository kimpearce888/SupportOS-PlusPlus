name: Nightly

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: Build (Linux x86_64)
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Linux system deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev \
            libssl-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev build-essential pkg-config \
            dpkg-dev rpm wget

      - name: Install trunk + tauri-cli
        run: |
          cargo install trunk --locked
          cargo install tauri-cli --version "^2.0" --locked

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: nightly-linux-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}

      - name: Build WASM frontend
        run: |
          cd crates/ui
          trunk build

      - name: Build Tauri app + bundle installers
        run: |
          cd crates/app/src-tauri
          cargo tauri build

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          BUNDLE_DIR="target/release/bundle"
          if [ ! -d "$BUNDLE_DIR" ]; then
            BUNDLE_DIR="crates/app/src-tauri/target/release/bundle"
          fi
          cd "$BUNDLE_DIR" || exit 0
          find . -type f \( -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" \) -exec sha256sum {} \; > checksums.txt || true
          cat checksums.txt 2>/dev/null || echo "No installer files found"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nightly-linux
          path: |
            target/release/bundle/**/*.deb
            target/release/bundle/**/*.rpm
            target/release/bundle/**/*.AppImage
            target/release/bundle/**/checksums.txt
            crates/app/src-tauri/target/release/bundle/**/*.deb
            crates/app/src-tauri/target/release/bundle/**/*.rpm
            crates/app/src-tauri/target/release/bundle/**/*.AppImage
          retention-days: 7

      - name: Upload to nightly pre-release
        if: github.event_name != 'schedule'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: "Nightly Development Build (Linux x86_64)"
          body: |
            ⚠️ Development build, unsigned.

            Built from commit ${{ github.sha }} on Linux x86_64.

            DO NOT use in production. Testing only.

            Windows and macOS are excluded by owner decision (see docs/DEVIATIONS.md DEV-006).
          prerelease: true
          files: |
            target/release/bundle/**/*.deb
            target/release/bundle/**/*.rpm
            target/release/bundle/**/*.AppImage
            target/release/bundle/**/checksums.txt
            crates/app/src-tauri/target/release/bundle/**/*.deb
            crates/app/src-tauri/target/release/bundle/**/*.rpm
            crates/app/src-tauri/target/release/bundle/**/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
