name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  e2e-linux:
    name: E2E (Linux, build + smoke)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Install system dependencies (Tauri 2 + xvfb)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev build-essential curl wget file pkg-config \
            xvfb
      - name: Install trunk + tauri-cli
        run: |
          cargo install trunk --locked
          cargo install tauri-cli --version "^2.0" --locked --no-default-features
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: e2e-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
      - name: Build WASM UI
        run: |
          cd crates/ui
          trunk build
      - name: Build Tauri app (debug)
        run: |
          cd crates/app/src-tauri
          cargo build
      - name: Launch app under xvfb + verify
        run: |
          # Build the binary path.
          APP_BIN="target/debug/supportos-plusplus"
          if [ ! -f "$APP_BIN" ]; then
            APP_BIN="crates/app/src-tauri/target/debug/supportos-plusplus"
          fi

          # Launch under xvfb. The app will try to open a window; xvfb provides
          # a virtual display. Set SPP_DATA_DIR to a temp dir for a clean DB.
          export SPP_DATA_DIR=/tmp/spp-e2e-test
          mkdir -p $SPP_DATA_DIR

          # Launch and wait 5 seconds, then check if the process is running.
          timeout 10 xvfb-run -a "$APP_BIN" &
          APP_PID=$!
          sleep 5

          if kill -0 $APP_PID 2>/dev/null; then
            echo "✅ App launched successfully under xvfb"
            echo "E2E_RESULT=pass" >> $GITHUB_ENV
            kill $APP_PID 2>/dev/null || true
          else
            echo "❌ App failed to launch or exited immediately"
            echo "E2E_RESULT=fail" >> $GITHUB_ENV
          fi

          # Cleanup.
          rm -rf $SPP_DATA_DIR
      - name: E2E result
        if: always()
        run: |
          echo "E2E result: ${{ env.E2E_RESULT }}"
          if [ "${{ env.E2E_RESULT }}" != "pass" ]; then
            exit 1
          fi
