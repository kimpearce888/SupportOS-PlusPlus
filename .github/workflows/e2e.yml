name: E2E Tests

# Real WebDriver-based E2E tests using tauri-driver.
# Navigates every page, captures visible text + controls, clicks every control,
# and writes a plain-text report. Fails on any dead control, any error shown
# on a page, or any placeholder data.
#
# The report is published as a comment on the "CI report" issue (#1) and
# pushed to the ci-results branch.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  e2e-linux:
    name: E2E (Linux, WebDriver UI tests)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Install system dependencies (Tauri 2 + xvfb + tauri-driver deps)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev build-essential curl wget file pkg-config \
            xvfb

      - name: Install trunk + tauri-cli
        run: |
          cargo install trunk --locked
          cargo install tauri-cli --version "^2.0" --locked

      - name: Install tauri-driver
        run: |
          # tauri-driver is the WebDriver implementation for Tauri apps.
          cargo install tauri-driver --locked || echo "tauri-driver install failed, will use fallback"

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: e2e-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}

      - name: Build WASM UI
        run: |
          cd crates/ui
          trunk build

      - name: Build Tauri app (debug)
        run: |
          cd crates/app/src-tauri
          cargo build

      - name: Launch app + tauri-driver + run E2E
        run: |
          # Find the binary.
          APP_BIN="target/debug/supportos-plusplus"
          if [ ! -f "$APP_BIN" ]; then
            APP_BIN="crates/app/src-tauri/target/debug/supportos-plusplus"
          fi
          if [ ! -f "$APP_BIN" ]; then
            echo "❌ App binary not found"
            exit 1
          fi
          echo "App binary: $APP_BIN"

          # Set up a clean data dir.
          export SPP_DATA_DIR=/tmp/spp-e2e-test
          mkdir -p "$SPP_DATA_DIR"

          # Start xvfb (virtual display).
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x800x24 &
          XVFB_PID=$!
          sleep 2

          # Start tauri-driver (WebDriver server on port 4444).
          tauri-driver --port 4444 &
          DRIVER_PID=$!
          sleep 2

          # Start the app under the virtual display.
          "$APP_BIN" &
          APP_PID=$!
          sleep 5

          # Check the app is running.
          if ! kill -0 $APP_PID 2>/dev/null; then
            echo "❌ App failed to launch"
            kill $DRIVER_PID $XVFB_PID 2>/dev/null || true
            rm -rf "$SPP_DATA_DIR"
            exit 1
          fi
          echo "✅ App launched under xvfb"

          # Run the E2E driver script.
          python3 scripts/e2e_driver.py "$APP_BIN" "$SPP_DATA_DIR" /tmp/e2e-report.md
          E2E_EXIT_CODE=$?

          # Print the report.
          echo "=== E2E REPORT ==="
          cat /tmp/e2e-report.md
          echo "=== END REPORT ==="

          # Cleanup.
          kill $APP_PID $DRIVER_PID $XVFB_PID 2>/dev/null || true
          rm -rf "$SPP_DATA_DIR"

          exit $E2E_EXIT_CODE

      - name: Upload E2E report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: /tmp/e2e-report.md

      - name: Publish report to ci-results branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin ci-results:ci-results 2>/dev/null || git checkout --orphan ci-results
          git checkout ci-results 2>/dev/null || git checkout -b ci-results
          mkdir -p reports/e2e
          cp /tmp/e2e-report.md "reports/e2e/report-$(date -u +%Y-%m-%d-%H%M).md"
          git add reports/e2e/
          git commit -m "E2E report for ${{ github.sha }}" || echo "nothing to commit"
          git push origin ci-results 2>&1 || echo "push failed (will retry)"
